[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evoplan"
version = "0.1.0"
description = "Trustworthy experience transfer and adaptive planning for agents in continual tasks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["evoplan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
